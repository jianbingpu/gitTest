<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Pages Function 测试</title>
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?43c8d9fcb84b08f81ec6ec923dccbf83";
      var s = document.getElementsByTagName("script")[0]; 
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
</head>
<body>
  <input type="text" id="promptInput" placeholder="输入问题">
  <button onclick="callAPI()">发送</button>
  <div id="output"></div>

  <script>
    async function callAPI() {
      const promptText = document.getElementById('promptInput').value;
      if (!promptText) return;

      // 重点：直接请求相对路径，Cloudflare 会自动路由到 functions/api/chat.js
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ prompt: promptText })
      });
      
      const data = await response.json();
      document.getElementById('output').innerText = data.response;
    }
  </script>
</body>
</html>
