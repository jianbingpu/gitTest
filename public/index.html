<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Cloudflare AI - Claude Opus 4.7</title>
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?43c8d9fcb84b08f81ec6ec923dccbf83";
      var s = document.getElementsByTagName("script")[0]; 
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
  <style>
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
    h1 { text-align: center; color: #00d4ff; }
    .chat-box { border: 1px solid #333; border-radius: 12px; padding: 20px; margin: 20px 0; background: rgba(255,255,255,0.03); }
    #output { min-height: 100px; white-space: pre-wrap; line-height: 1.6; }
    .input-row { display: flex; gap: 10px; }
    #promptInput { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a4a; color: #fff; font-size: 16px; }
    button { padding: 12px 24px; border-radius: 8px; border: none; background: linear-gradient(135deg, #00d4ff, #7b2ff7); color: #fff; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }
    .loading { color: #888; font-style: italic; }
    .model-tag { text-align: center; color: #7b2ff7; margin-bottom: 20px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>🐢 Cloudflare AI</h1>
  <p class="model-tag">🤖 Anthropic Claude Opus 4.7</p>
  <div class="input-row">
    <input type="text" id="promptInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')callAPI()">
    <button onclick="callAPI()">发送</button>
  </div>
  <div class="chat-box">
    <div id="output">等待你的问题...</div>
  </div>

  <script>
    async function callAPI() {
      const promptText = document.getElementById('promptInput').value.trim();
      if (!promptText) return;
      document.getElementById('output').innerHTML = '<span class="loading">思考中...</span>';
      document.getElementById('promptInput').value = '';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await response.json();
        document.getElementById('output').innerText = data.response || JSON.stringify(data, null, 2);
      } catch (e) {
        document.getElementById('output').innerText = '错误: ' + e.message;
      }
    }
  </script>
</body>
</html>
