<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 画图 - Stable Diffusion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
    h1 {
      text-align: center;
      font-size: 2.2em;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0 10px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      justify-content: center;
    }
    .tab-btn {
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      border-color: transparent;
      color: #1a1a2e;
      font-weight: bold;
    }
    .tab-btn:not(.active):hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }
    .section-title {
      font-size: 1.1em;
      color: #feca57;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 1em;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border 0.3s;
    }
    textarea:focus { border-color: #feca57; }
    textarea::placeholder { color: #666; }
    .hint-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .hint-tag {
      padding: 5px 12px;
      border-radius: 15px;
      background: rgba(255,255,255,0.06);
      color: #888;
      font-size: 0.85em;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .hint-tag:hover { background: rgba(254,202,87,0.15); color: #feca57; }
    .upload-area {
      border: 2px dashed rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 15px;
      position: relative;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #48dbfb;
      background: rgba(72,219,251,0.05);
    }
    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .upload-icon { font-size: 2.5em; margin-bottom: 10px; }
    .upload-hint { color: #888; font-size: 0.9em; }
    .preview-img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }
    .preview-img.show { display: block; }
    .generate-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #ff6b6b, #feca57);
      color: #1a1a2e;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,107,107,0.35);
    }
    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .output-area {
      margin-top: 25px;
      text-align: center;
    }
    .loading {
      padding: 40px;
      color: #888;
      font-style: italic;
    }
    .loading-spinner {
      font-size: 2em;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result-img {
      max-width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      margin-top: 15px;
    }
    .error-msg {
      color: #ff6b6b;
      padding: 15px;
      background: rgba(255,107,107,0.1);
      border-radius: 10px;
      margin-top: 15px;
      font-size: 0.9em;
    }
    .img2img-section { display: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .model-tag { text-align: center; color: #666; margin-bottom: 20px; font-size: 0.85em; }
    
    
    .image-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 9999;
  overflow-y: auto; padding: 20px; text-align: center;
}
.image-modal.show { display: flex; align-items: center; justify-content: center; flex-direction: column; }
.image-modal img {
  max-width: 100%; height: auto; border-radius: 20px; 
  box-shadow: 0 10px 50px rgba(0,0,0,0.8); object-fit: contain;
  -webkit-touch-callout: default; user-select: auto;
}
.close-hint { color: rgba(255,255,255,0.6); font-size: 0.9em; margin-top: 15px; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 AI 画图</h1>
    <p class="model-tag">Stable Diffusion v1.5</p>

   <div class="tabs">
  <button class="tab-btn active" onclick="switchTab('txt2img', this)">📝 文生图</button>
  <button class="tab-btn" onclick="switchTab('img2img', this)">🖼️ 图生图</button>
</div>

<div class="tab-content active" id="tab-txt2img">
  <div class="card">
    <div class="section-title">🔮 描述你的画面</div>
    <textarea id="txt2img-prompt" placeholder="例如：a beautiful landscape, sunset, mountains, lake, highly detailed, 8k"></textarea>
    <div class="hint-tags">
      <button class="hint-tag" onclick="appendPrompt('masterpiece, best quality, highly detailed')"> masterpiece</button>
      <button class="hint-tag" onclick="appendPrompt('cinematic lighting, dramatic')"> 电影感光</button>
      <button class="hint-tag" onclick="appendPrompt('ultra realistic, 8k, photorealistic')"> 超写实</button>
      <button class="hint-tag" onclick="appendPrompt('anime style, vibrant colors')"> 动漫风</button>
    </div>
    <button class="generate-btn" id="txt2img-btn" onclick="generateTxt2Img()">🎨 生成图片</button>
    <div class="output-area" id="txt2img-output"></div>
  </div>
</div>

<div class="tab-content" id="tab-img2img">
  <div class="card">
    <div class="section-title">📤 上传参考图片</div>
    <div class="upload-area" id="img2img-upload" onclick="document.getElementById('img2img-input').click()">
      <div class="upload-icon">🖼️</div>
      <div class="upload-hint">点击或拖拽图片到这里（支持 PNG/JPG）</div>
      <input type="file" id="img2img-input" accept="image/*" onchange="previewImg(this)">
      <img class="preview-img" id="img2img-preview" alt="预览">
    </div>

    <div class="section-title" style="margin-top:20px">✏️ 描述你想变成什么样</div>
    <textarea id="img2img-prompt" placeholder="描述你想把图片改成什么样，例如：change to a snowy mountain landscape"></textarea>
    <div class="hint-tags">
      <button class="hint-tag" onclick="appendPrompt('more vibrant colors')"> 更鲜艳</button>
      <button class="hint-tag" onclick="appendPrompt('change to winter theme')"> 冬季主题</button>
      <button class="hint-tag" onclick="appendPrompt('cartoon style')"> 卡通风格</button>
    </div>
    <button class="generate-btn" id="img2img-btn" onclick="generateImg2Img()">🖼️ 生成图片</button>
    <div class="output-area" id="img2img-output"></div>
  </div>
</div>

  <script>
    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      btn.classList.add('active');
    }

    function appendPrompt(text) {
      const ta = document.activeElement.tagName === 'TEXTAREA'
        ? document.activeElement
        : document.querySelector('textarea:focus') || document.getElementById('txt2img-prompt');
      ta.value += (ta.value ? ', ' : '') + text;
    }

    async function generateTxt2Img() {
      const prompt = document.getElementById('txt2img-prompt').value.trim();
      if (!prompt) { alert('请输入描述文字'); return; }
      const btn = document.getElementById('txt2img-btn');
      const out = document.getElementById('txt2img-output');
      btn.disabled = true;
      btn.textContent = '🎨 生成中...';
      out.innerHTML = '<div class="loading"><div class="loading-spinner">⏳</div>AI 画图中，请稍候...</div>';

      try {
        const resp = await fetch('/api/txt2img', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });
        const data = await resp.json();
        if (data.error) {
          out.innerHTML = `<div class="error-msg">错误: ${data.error}</div>`;
        } else if (data.image) {
          out.innerHTML = `<img class="result-img" src="${data.image}" alt="生成结果">`;
        } else {
          out.innerHTML = `<div class="error-msg">意外响应: ${JSON.stringify(data)}</div>`;
        }
      } catch (e) {
        out.innerHTML = `<div class="error-msg">请求失败: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🎨 生成图片';
      }
    }

    async function generateImg2Img() {
      const prompt = document.getElementById('img2img-prompt').value.trim();
      const fileInput = document.getElementById('img2img-input');
      if (!prompt) { alert('请输入描述文字'); return; }
      if (!fileInput.files.length) { alert('请先上传参考图片'); return; }

      const btn = document.getElementById('img2img-btn');
      const out = document.getElementById('img2img-output');
      btn.disabled = true;
      btn.textContent = '🖼️ 生成中...';
      out.innerHTML = '<div class="loading"><div class="loading-spinner">⏳</div>AI 处理中，请稍候...</div>';

      try {
        const resp = await fetch('/api/img2img', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            image: await toBase64(fileInput.files[0])
          })
        });
        const data = await resp.json();
        if (data.error) {
          out.innerHTML = `<div class="error-msg">错误: ${data.error}</div>`;
        } else if (data.image) {
          out.innerHTML = `<img class="result-img" src="${data.image}" alt="生成结果">`;
        } else {
          out.innerHTML = `<div class="error-msg">意外响应: ${JSON.stringify(data)}</div>`;
        }
      } catch (e) {
        out.innerHTML = `<div class="error-msg">请求失败: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🖼️ 生成图片';
      }
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function previewImg(input) {
      const preview = document.getElementById('img2img-preview');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.classList.add('show');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 拖拽上传
    const uploadArea = document.getElementById('img2img-upload');
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      document.getElementById('img2img-input').files = e.dataTransfer.files;
      previewImg(document.getElementById('img2img-input'));
    });
  </script>
</body>
</html>
